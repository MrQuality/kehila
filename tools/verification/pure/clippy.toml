  "std::env::args", "std::env::args_os", "std::env::current_dir",
  "std::env::current_exe", "std::env::temp_dir", "std::env::set_var",
  "std::env::remove_var", "std::env::set_current_dir",
  "std::io::stdin", "std::io::stdout", "std::io::stderr",
  "std::thread::spawn", "std::thread::sleep", "std::thread::park",
  "std::thread::park_timeout", "std::thread::current", "std::thread::yield_now",
  "std::thread::scope", "std::thread::available_parallelism",
  "std::process::exit", "std::process::abort", "std::process::id",
]
