# Compiler-resolved guard, deliberately scoped to pure library targets.
# In-memory Read/Write traits and deterministic formatting are allowed.
disallowed-types = [
  "std::fs::File", "std::fs::OpenOptions", "std::fs::ReadDir",
  "std::net::TcpStream", "std::net::TcpListener", "std::net::UdpSocket",
  "std::process::Command", "std::process::Child", "std::thread::Builder",
  "std::time::SystemTime", "std::time::Instant",
  "std::thread::Thread", "std::thread::JoinHandle",
  "std::os::unix::net::UnixStream", "std::os::unix::net::UnixListener",
  "std::os::unix::net::UnixDatagram", "std::fs::DirBuilder",
  "std::collections::hash_map::RandomState",
]
disallowed-methods = [
  "std::path::Path::exists", "std::path::Path::try_exists",
  "std::path::Path::is_file", "std::path::Path::is_dir", "std::path::Path::is_symlink",
  "std::path::Path::metadata", "std::path::Path::symlink_metadata",
  "std::path::Path::read_dir", "std::path::Path::read_link", "std::path::Path::canonicalize",
  "std::fs::File::open", "std::fs::File::create", "std::fs::OpenOptions::open",
  "std::fs::File::create_new", "std::fs::File::options", "std::fs::OpenOptions::new",
  "std::fs::exists", "std::process::Command::new", "std::thread::Builder::new",
  "std::time::SystemTime::now", "std::time::Instant::now",
  "std::net::TcpStream::connect", "std::net::TcpStream::connect_timeout",
  "std::net::TcpListener::bind", "std::net::UdpSocket::bind",
  "std::net::ToSocketAddrs::to_socket_addrs",
  "std::fs::read", "std::fs::read_to_string", "std::fs::write",
  "std::fs::read_dir", "std::fs::metadata", "std::fs::symlink_metadata",
  "std::fs::canonicalize", "std::fs::copy", "std::fs::rename",
  "std::fs::remove_file", "std::fs::remove_dir", "std::fs::remove_dir_all",
  "std::fs::create_dir", "std::fs::create_dir_all", "std::fs::set_permissions",
  "std::fs::hard_link", "std::fs::read_link",
  "std::fs::DirBuilder::new", "std::fs::DirBuilder::create",
  "std::os::unix::net::UnixStream::connect", "std::os::unix::net::UnixStream::pair",
