[package]
name = "kehila_local_tls_probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# This disposable experiment does not alter the production dependency graph.
[workspace]

[dependencies]
bytes = "=1.11.1"
data-encoding = { version = "=2.11.1", default-features = false }
http-body-util = "=0.1.3"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
pkcs8 = { version = "=0.11.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
sec1 = { version = "=0.8.0", default-features = false, features = ["der"] }
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt", "net", "sync", "time", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
x509-cert = { version = "=0.3.0", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

time = { version = "=0.3.55", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
