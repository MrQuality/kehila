name: Disposable direct SSH research
on:
  push:
    tags: ['sp007-direct-probe-*']
permissions:
  contents: read
  actions: write # Delete only this run's owned encrypted descriptors at closeout.
concurrency:
  group: disposable-direct-ssh-probe
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'MrQuality/kehila' && github.actor == 'MrQuality' &&
      github.run_attempt == 1 && github.sha == vars.SP007_DIRECT_SSH_SHA &&
      github.ref == vars.SP007_DIRECT_SSH_REF
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROBE_PHASE: ${{ vars.SP007_DIRECT_SSH_PHASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate admission and prepare synthetic envelope
        env:
          PROBE_CONFIG: ${{ secrets.SP007_DIRECT_SSH_CONFIG }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PROBE_PHASE" = control || test "$PROBE_PHASE" = live || test "$PROBE_PHASE" = admission
          umask 077
          python experiments/hosted_ssh_probe/probe.py prepare "$RUNNER_TEMP/direct-ssh"
      - name: Return synthetic Linux encryption control before live exposure
        if: env.PROBE_PHASE == 'control'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssh-probe-control
          path: ${{ runner.temp }}/direct-ssh/control.der
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Bounded control retrieval window
        if: env.PROBE_PHASE == 'control'
        run: sleep 60
      - name: Nonpublic listener admission only
        if: env.PROBE_PHASE == 'admission'
        run: python experiments/hosted_ssh_probe/probe.py admission "$RUNNER_TEMP/direct-ssh"
      - name: Start independently bounded synthetic SSH owner
        if: env.PROBE_PHASE == 'live'
        run: |
          setsid python experiments/hosted_ssh_probe/probe.py serve "$RUNNER_TEMP/direct-ssh" \
            > "$RUNNER_TEMP/direct-ssh/controller.log" 2>&1 < /dev/null &
          python experiments/hosted_ssh_probe/probe.py wait "$RUNNER_TEMP/direct-ssh"
      - name: Return encrypted endpoint to admitted local recipient
        if: env.PROBE_PHASE == 'live'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssh-probe-endpoint
          path: ${{ runner.temp }}/direct-ssh/descriptor.der
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Observe owned expiry and aggregate result
        if: env.PROBE_PHASE == 'live' || env.PROBE_PHASE == 'admission'
        run: python experiments/hosted_ssh_probe/probe.py finish "$RUNNER_TEMP/direct-ssh"
      - name: Remove owned container and encrypted artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python experiments/hosted_ssh_probe/probe.py cleanup "$RUNNER_TEMP/direct-ssh"
