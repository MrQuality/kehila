<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="768" viewBox="0 0 2048 768" role="img" aria-labelledby="title desc">
<title id="title">Kehila community logo</title>
<desc id="desc">Vector reconstruction of the supplied Kehila logo. Six ribbon figures surrounding a white star-shaped opening, with a custom Kehila wordmark. Lettering is outlined; gradients and shadow approximate the raster lighting. Transparent background.</desc>
